<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography Portfolio</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url("Stars.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 40px;

            background: rgba(248, 250, 255, 0.93);

            border: 4px solid #1e3a8a;
            border-radius: 25px;

            box-shadow:
                0 0 10px #ffffff,
                0 0 20px #3b82f6,
                0 0 40px #1e3a8a,
                0 0 60px rgba(30, 58, 138, 0.5);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
        }

        h2 {
            color: #1e3a8a;
        }

        p {
            color: #1f2937;
            line-height: 1.7;
            font-size: 17px;
        }

        img {
            width: 100%;
            max-width: 700px;
            display: block;
            margin: 20px auto;
            border-radius: 15px;

            box-shadow:
                0 0 10px rgba(0,0,0,0.3),
                0 0 20px rgba(59,130,246,0.3);
        }

        .home-button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;

            background: #1e3a8a;
            color: white;

            text-decoration: none;
            border-radius: 12px;

            box-shadow:
                0 0 10px #3b82f6,
                0 0 20px #1e3a8a;
        }

        .home-button:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>

    <div class="container">

        <h1>🌙 Midnight Blue Photography 🌙</h1>

        <h2>Featured Photograph</h2>

        <img src="photo1.jpg" alt="Photography Project">

        <p>
            Describe your photograph here. Talk about the subject,
            inspiration, composition, lighting, and what you wanted
            viewers to notice.
        </p>

        <a href="index.html" class="home-button">← Back to Home</a>

    </div>

</body>
</html>
